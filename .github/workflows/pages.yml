name: Pages (web/ 폴더를 주소로)

# main에 올리면 web/ 폴더가 https://<계정>.github.io/hunsu-omok/ 아래에 공개된다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번만 바꿔 두면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
