name: Pages (web/ 폴더를 주소로)

# main에 올리면 web/ 폴더를 gh-pages 브랜치로 복사한다.
# GitHub Pages가 gh-pages 브랜치를 그대로 서비스한다:
#   https://pwxmh2xy79-sudo.github.io/hunsu-omok/solo.html  (맞은편 오목)
#   https://pwxmh2xy79-sudo.github.io/hunsu-omok/           (훈수 오목)
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: web/ → gh-pages
        run: |
          set -e
          out=$(mktemp -d)
          cp -r web/. "$out"/
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "publish web/ from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
