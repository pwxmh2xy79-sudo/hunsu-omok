name: Pages (web/ 폴더를 주소로)

# main에 올리면 web/ 폴더가 아래 주소로 공개된다.
#   https://pwxmh2xy79-sudo.github.io/hunsu-omok/solo.html  (맞은편 오목)
#   https://pwxmh2xy79-sudo.github.io/hunsu-omok/           (훈수 오목)
# 저장소 Pages 설정이 "GitHub Actions"든 "Deploy from a branch(gh-pages)"든 둘 다 맞춰 둔다.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Source = GitHub Actions 일 때: 올리기(build) → 내보내기(deploy)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Source = Deploy from a branch (gh-pages) 일 때
  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: web/ → gh-pages
        run: |
          set -e
          out=$(mktemp -d)
          cp -r web/. "$out"/
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "publish web/ from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
